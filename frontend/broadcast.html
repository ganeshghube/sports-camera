<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cricket Live Broadcast Renderer</title>
<style>
html,body{margin:0;padding:0;width:100vw;height:100vh;overflow:hidden;background:#000}
.broadcast-stage{position:absolute;inset:0;width:100vw;height:100vh;overflow:hidden;background:#000}
.broadcast-viewport{position:absolute;inset:0;width:100vw;height:100vh;transform-origin:50% 50%;will-change:transform}
#camera{position:absolute;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000;display:block}
#scoreOverlay{position:absolute;inset:0;width:100vw;height:100vh;border:0;background:transparent;display:block;pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="broadcast-stage">
  <div class="broadcast-viewport" id="viewport">
    <img id="camera" src="/api/internal/raw-camera.mjpeg" alt="">
  </div>
</div>
<iframe id="scoreOverlay" src="/index.html?overlay=1" title="Score overlay"></iframe>

<script>
(function() {
  const vp = document.getElementById("viewport");
  let autoZoom = false;
  let currentZoom = 1.0, targetZoom = 1.0;
  let currentOriginX = 50, currentOriginY = 50, targetOriginX = 50, targetOriginY = 50;
  let detection = null, lastFrameW = 0, lastFrameH = 0, lastDetectionAt = 0;
  let outOfPitchSince = 0;
  let lastZoomTime = performance.now();

  function updateZoom() {
    const now = performance.now();
    const dt = Math.max(0.001, Math.min((now - lastZoomTime) / 1000, 0.1));
    lastZoomTime = now;

    const hasBall = detection && lastFrameW && lastFrameH && (Date.now() - lastDetectionAt < 1400);
    if (autoZoom && hasBall) {
      const nx = detection.x / lastFrameW;
      const ny = detection.y / lastFrameH;
      const inPitchZone = Math.abs(nx - 0.5) <= 0.20 && Math.abs(ny - 0.5) <= 0.25;
      const nowMs = Date.now();
      let zoomActive = false;

      if (typeof detection.shot_active === "boolean") {
        zoomActive = detection.shot_active;
        if (!zoomActive) outOfPitchSince = 0;
      } else if (inPitchZone && currentZoom <= 1.08) {
        outOfPitchSince = 0;
      } else {
        if (!outOfPitchSince) outOfPitchSince = nowMs;
        if (nowMs - outOfPitchSince >= 200 || currentZoom > 1.08) {
          zoomActive = true;
        }
      }

      if (zoomActive) {
        const zFactor = detection.zoom_factor ? Math.max(1.4, Math.min(3.0, Number(detection.zoom_factor))) : 2.2;
        targetZoom = zFactor;
        const clampedX = Math.max(12, Math.min(88, nx * 100));
        const clampedY = Math.max(12, Math.min(88, ny * 100));
        if (Math.abs(clampedX - targetOriginX) > 1.0) targetOriginX = clampedX;
        if (Math.abs(clampedY - targetOriginY) > 1.0) targetOriginY = clampedY;
      } else {
        targetZoom = 1.0;
        targetOriginX = 50;
        targetOriginY = 50;
      }
    } else {
      outOfPitchSince = 0;
      targetZoom = 1.0;
      targetOriginX = 50;
      targetOriginY = 50;
    }

    // Dynamic responsive auto-zoom:
    const maxZoomRate = 0.15;
    const maxPanRate = 8.4;
    const ease = 0.021;

    const maxZoomStep = maxZoomRate * 3.5 * dt;
    const zoomDiff = targetZoom - currentZoom;
    const zoomStep = Math.sign(zoomDiff) * Math.min(Math.abs(zoomDiff) * (ease * 3.5 * 60 * dt), maxZoomStep);
    currentZoom += zoomStep;

    const maxPanStep = maxPanRate * 4.0 * dt;
    const panDiffX = targetOriginX - currentOriginX;
    const panStepX = Math.sign(panDiffX) * Math.min(Math.abs(panDiffX) * (ease * 4.0 * 60 * dt), maxPanStep);
    currentOriginX += panStepX;

    const panDiffY = targetOriginY - currentOriginY;
    const panStepY = Math.sign(panDiffY) * Math.min(Math.abs(panDiffY) * (ease * 4.0 * 60 * dt), maxPanStep);
    currentOriginY += panStepY;

    if (vp) {
      if (Math.abs(currentZoom - 1.0) < 0.005 && targetZoom === 1.0) {
        currentZoom = 1.0;
        vp.style.transformOrigin = "50% 50%";
        vp.style.transform = "none";
      } else {
        vp.style.transformOrigin = `${currentOriginX.toFixed(1)}% ${currentOriginY.toFixed(1)}%`;
        vp.style.transform = `scale(${currentZoom.toFixed(3)})`;
      }
    }
  }

  // Support both requestAnimationFrame and setInterval for headless Chromium capture
  function frameLoop() {
    updateZoom();
    requestAnimationFrame(frameLoop);
  }
  requestAnimationFrame(frameLoop);
  setInterval(updateZoom, 33);

  // Standalone tracker WebSocket connection with auto-reconnect
  let ws, retry = 500, closed = false;
  function connect() {
    if (closed) return;
    try {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws/ball-tracking-ui`);
      ws.onopen = () => { retry = 500; };
      ws.onmessage = ev => {
        try {
          const m = JSON.parse(ev.data);
          if (m.type === "status") {
            if (typeof m.auto_zoom === "boolean") autoZoom = m.auto_zoom;
            if (m.frame_width) { lastFrameW = m.frame_width; lastFrameH = m.frame_height || lastFrameH; }
            if (m.detected) { detection = m; lastDetectionAt = Date.now(); }
            else if (Date.now() - lastDetectionAt > 1400) detection = null;
          } else if (m.type === "ball_detection") {
            detection = m;
            lastDetectionAt = Date.now();
            if (m.frame_width) { lastFrameW = m.frame_width; lastFrameH = m.frame_height || lastFrameH; }
          } else if (m.type === "zoom") {
            if (m.zoom_factor && m.ball_x !== null && detection) detection.zoom_factor = m.zoom_factor;
          }
        } catch (e) {}
      };
      ws.onclose = () => {
        if (!closed) {
          setTimeout(connect, retry);
          retry = Math.min(retry * 2, 5000);
        }
      };
      ws.onerror = () => { try { ws.close(); } catch(e){} };
    } catch (e) {
      setTimeout(connect, 1000);
    }
  }
  connect();
})();
</script>
</body>
</html>
